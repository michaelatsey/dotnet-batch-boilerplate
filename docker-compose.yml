# Environnement local : PostgreSQL + tableau de bord OpenTelemetry (traces, métriques, logs).
#   docker compose up -d
#   export DOTNET_ENVIRONMENT=Development OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#   dotnet run --project src/Batch.Host -- db init
#   dotnet run --project src/Batch.Host -- run import-invoices -p InputFile=samples/invoices.csv
#   Tableau de bord : http://localhost:18888
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: batch
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: batch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batch"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  pgdata:
